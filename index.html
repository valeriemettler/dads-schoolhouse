<title>Dad's Schoolhouse</title>

<style>
  :root {
    --paper: #fcfcf8;
    --rule: #d9e6f4;
    --margin-line: #efb3ad;
    --ink: #24324b;
    --ink-soft: #56627a;
    --red: #c23b31;
    --on-red: #ffffff;
    --gold: #d6a23a;
    --grass: #8db255;
    --frame: #ffffff;
    --frame-ink: #2a3650;
    --field: #ffffff;
    --shadow: rgba(36, 50, 75, 0.22);
    --focus: #2f6fd6;
    --f-hand: "Schoolbell", "Chalkboard SE", "Comic Sans MS", cursive;
    --f-body: "Andika", "Trebuchet MS", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1f372d;
      --rule: #294335;
      --margin-line: #74524c;
      --ink: #eef1e6;
      --ink-soft: #b8c4b4;
      --red: #f2897c;
      --on-red: #2b1512;
      --gold: #f0cf78;
      --grass: #7fa65a;
      --frame: #f2efe6;
      --frame-ink: #283a30;
      --field: #294335;
      --shadow: rgba(0, 0, 0, 0.45);
      --focus: #f0cf78;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 1.0625rem;
    line-height: 1.55;
  }
  body::before { content: ""; position: fixed; top: 0; bottom: 0; left: 20px; width: 2px; background: var(--margin-line); }
  .gate { width: min(26rem, 100%); margin-inline: auto; padding: 56px 20px 40px 40px; display: grid; gap: 14px; justify-items: start; }
  .house { width: 150px; height: auto; }
  .house .h-sun { fill: var(--gold); }
  .house .h-rays { fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; }
  .house .h-ground { fill: var(--grass); }
  .house .h-wall { fill: var(--frame); stroke: var(--frame-ink); stroke-width: 3; stroke-linejoin: round; }
  .house .h-line { fill: none; stroke: var(--frame-ink); stroke-opacity: 0.22; stroke-width: 2; }
  .house .h-roof { fill: var(--red); stroke: var(--frame-ink); stroke-width: 3; stroke-linejoin: round; }
  .house .h-sign { fill: var(--frame-ink); }
  h1 { margin: 0; font-family: var(--f-hand); font-weight: 400; font-size: clamp(2.4rem, 9vw, 3.2rem); line-height: 1; }
  p { margin: 0; }
  form { width: 100%; display: grid; gap: 10px; }
  label[for="pw"] { font-family: var(--f-hand); font-size: 1.3rem; }
  .row { display: flex; gap: 10px; }
  #pw {
    flex: 1;
    min-width: 0;
    font: inherit;
    padding: 0.45em 0.7em;
    color: var(--ink);
    background: var(--field);
    border: 2px solid var(--ink-soft);
    border-radius: 10px;
  }
  button {
    font-family: var(--f-hand);
    font-size: 1.3rem;
    line-height: 1.2;
    color: var(--on-red);
    background: var(--red);
    border: 0;
    border-radius: 999px;
    padding: 0.3em 1.1em 0.4em;
    box-shadow: 0 3px 0 var(--shadow);
    cursor: pointer;
  }
  .keep { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 0.97rem; }
  .keep input { width: 18px; height: 18px; accent-color: var(--red); }
  #msg { min-height: 1.6em; color: var(--red); font-weight: 700; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .trying form { visibility: hidden; }
</style>
</head>

  <h1>Dad's Schoolhouse</h1>
  <p>This page is just for family. Type the password to open it.</p>
  <form id="gate-form">
    <label for="pw">Password</label>
    <div class="row">
      <input id="pw" type="text" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button type="submit">Open</button>
    </div>
    <label class="keep"><input id="show" type="checkbox" checked> Show password</label>
    <label class="keep"><input id="keep" type="checkbox" checked> Remember me on this device</label>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
  <noscript><p>Turn on JavaScript to open this page.</p></noscript>
</main>

    var SAVED = "dads-schoolhouse-password";
    var form = document.getElementById("gate-form");
    var input = document.getElementById("pw");
    var keep = document.getElementById("keep");
    var showPw = document.getElementById("show");
    var msg = document.getElementById("msg");
    // the password shows as it's typed unless the box is unticked
    showPw.addEventListener("change", function () {
      input.type = showPw.checked ? "text" : "password";
      input.focus();
    });
    var subtle = window.crypto && window.crypto.subtle;

    function bytes(b64) {
      var bin = atob(b64), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function unlock(pw) {
      if (!subtle) return Promise.reject(new Error("no-crypto"));
      return subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"])
        .then(function (base) {
          return subtle.deriveKey({ name: "PBKDF2", salt: bytes(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        })
        .then(function (key) {
          return subtle.decrypt({ name: "AES-GCM", iv: bytes(DATA.iv) }, key, bytes(DATA.ct)).then(function (plain) {
            return { key: key, html: new TextDecoder().decode(plain) };
          });
        });
    }
    // Photos come down encrypted (12-byte IV, then the sealed JPEG) and are decrypted into blob
    // URLs a few at a time, in page order, with the ones on screen moved to the front.
    function openPhotos(key) {
      var queue = Array.prototype.slice.call(document.querySelectorAll("img[data-locked]"));
      var active = 0;
      function load(img) {
        var path = img.getAttribute("data-locked");
        img.removeAttribute("data-locked");
        return fetch(path)
          .then(function (r) { if (!r.ok) throw new Error(path); return r.arrayBuffer(); })
          .then(function (buf) {
            var b = new Uint8Array(buf);
            return subtle.decrypt({ name: "AES-GCM", iv: b.subarray(0, 12) }, key, b.subarray(12));
          })
          .then(function (jpeg) { img.src = URL.createObjectURL(new Blob([jpeg], { type: "image/jpeg" })); });
      }
      function next() {
        while (active < 4 && queue.length) {
          var img = queue.shift();
          if (!img.hasAttribute("data-locked")) continue;
          active++;
          load(img).catch(function () {}).then(function () { active--; next(); });
        }
      }
      if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (!e.isIntersecting) return;
            io.unobserve(e.target);
            var i = queue.indexOf(e.target);
            if (i > 0) { queue.splice(i, 1); queue.unshift(e.target); }
          });
          next();
        }, { rootMargin: "600px 0px" });
        queue.forEach(function (img) { io.observe(img); });
      }
      next();
    }

      if (hash) {
        setTimeout(function () {
          var el = document.getElementById(hash.slice(1));
          if (el) el.scrollIntoView();
        }, 80);
      }
    }
    function remember(pw) {
      try {
        if (keep.checked) localStorage.setItem(SAVED, pw);
        else localStorage.removeItem(SAVED);
      } catch (e) {}
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var pw = input.value.trim().toLowerCase();
      msg.textContent = "Opening...";
      unlock(pw).then(function (opened) {
        remember(pw);
        show(opened);
      }).catch(function (err) {
        msg.textContent = err && err.message === "no-crypto"
          ? "This browser can't open the page. Try a newer browser."
          : "That's not it. Try again.";
        input.select();
      });
    });

    var saved = null;
    try { saved = localStorage.getItem(SAVED); } catch (e) {}
    if (saved) {
      document.body.classList.add("trying");
      unlock(saved).then(show).catch(function () {
        try { localStorage.removeItem(SAVED); } catch (e) {}
        document.body.classList.remove("trying");
        input.focus();
      });
    } else {
      input.focus();
    }
  })();
</script>
</body>
</html>
